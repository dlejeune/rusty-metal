[package]
# The crate and binary are `rusty-metal`, all lower case: it is what gets typed on a
# command line and what package tooling sorts and matches on. The stylised form
# `rusty-metAL` is the display name, and appears in help output, the startup banner and
# the README. See `DISPLAY_NAME` in `src/main.rs`.
name = "rusty-metal"
version = "0.2.0"
edition = "2024"
authors = ["Daniel Le Jeune"]
license-file = "LICENSE"
description = "rusty-metAL: pairwise distances between multiple sequence alignments"
readme = "README.md"
repository = "https://github.com/dlejeune/rusty-metal"

[package.metadata.wix]
upgrade-guid = "BBEA1C8F-A82E-4831-87F9-DBC4C6D6A138"
path-guid = "D39F1CC4-7BA4-419D-8621-07CE602A8B4B"
license = false
eula = false

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.31", features = ["derive"] }
seq_io = "0.3.4"
thiserror = "2.0.12"
log = "0.4.22"
colored = "3.0.0"
simple_logger = "5.0.0"
itertools = "0.14.0"
rayon = "1.11.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
